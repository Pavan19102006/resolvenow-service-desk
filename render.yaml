databases:
  - name: resolvenow-postgres
    databaseName: resolvenow_db
    user: resolvenow_user
    plan: free

services:
  - type: web
    name: resolvenow-service-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resolvenow-postgres
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
