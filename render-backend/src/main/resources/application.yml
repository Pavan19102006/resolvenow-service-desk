server:
  port: 8081
  tomcat:
    so-linger: -1

spring:
  application:
    name: render-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:renderdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
  h2:
    console:
      enabled: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

services:
  assignment:
    url: ${SERVICES_ASSIGNMENT_URL:http://localhost:8081/assignments}
  notification:
    url: ${SERVICES_NOTIFICATION_URL:http://localhost:8081/notifications}
