server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:lb://AUTH-SERVICE}
          predicates:
            - Path=/auth/**
        - id: complaint-service
          uri: ${COMPLAINT_SERVICE_URL:lb://COMPLAINT-SERVICE}
          predicates:
            - Path=/complaints/**
        - id: assignment-service
          uri: ${ASSIGNMENT_SERVICE_URL:lb://ASSIGNMENT-SERVICE}
          predicates:
            - Path=/assignments/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:lb://NOTIFICATION-SERVICE}
          predicates:
            - Path=/notifications/**

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
